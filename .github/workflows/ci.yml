name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }} # binstall rate limits

jobs:
  ci-core:
    name: ./mk ci-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semver compares with the last tag; commits and ratchet with the base branch
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          tier: ci
          save-cache: "true"

      - name: Run blocking non-mutation gates
        run: ./mk ci-core

  mutants-plan:
    name: Plan diff mutants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mutants: ${{ steps.plan.outputs.mutants }}
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          tier: ci
          save-cache: "false"

      - name: Compute diff mutant shards
        id: plan
        run: |
          plan="$(./mk mutants-plan --mode diff)"
          echo "$plan"
          mutants="$(jq -r '.mutants' <<<"$plan")"
          shards="$(jq -r '.shards' <<<"$plan")"
          matrix="$(jq -c '[range(0; .shards)]' <<<"$plan")"
          {
            echo "mutants=$mutants"
            echo "shards=$shards"
            echo "matrix=$matrix"
          } >>"$GITHUB_OUTPUT"

  mutants-diff:
    name: ./mk mutants-diff (${{ matrix.shard }})
    needs: [ci-core, mutants-plan]
    if: ${{ needs.mutants-plan.outputs.mutants != '0' && needs.mutants-plan.outputs.shards != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.mutants-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          tier: ci
          save-cache: "false"

      - name: Run diff mutation shard
        env:
          MUTANTS_IN_PLACE: "1"
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ needs.mutants-plan.outputs.shards }}
        run: |
          if [ "$TOTAL" -gt 1 ]; then
            ./mk mutants-diff --shard "$SHARD/$TOTAL" --sharding slice --baseline=skip --timeout "${MUTANTS_TIMEOUT:-120}"
          else
            ./mk mutants-diff
          fi
