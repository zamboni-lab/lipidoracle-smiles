[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
# Permissive licenses plus the project's own. Anything else needs an explicit, reviewed entry.
allow = [
  "0BSD",
  "MIT",  # this project's own license
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
# Crates with `publish = false` are not licensed to anyone; check their dependencies only.
ignore = true

[bans]
# Duplicates go in `skip` with a reason; the list may only shrink.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
