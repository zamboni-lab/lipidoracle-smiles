[package]
name = "shorthand2smiles"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Convert Shorthand2020 lipid names to SMILES/CXSMILES, encoding what was and wasn't determined"
license = "MIT"
repository = "https://github.com/zamboni-lab/lipidoracle-smiles"
keywords = ["lipidomics", "smiles", "cxsmiles", "cheminformatics", "lipids"]
categories = ["science"]

# No dependencies, deliberately. The generator is string manipulation over
# std collections only, which keeps it embeddable anywhere a lipid name needs
# a structure.
